[package]
name = "nirux-ii"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "NIRUX II - Night of the Daemons, an original Commodore 64 style action platformer for the NIRUX desktop"
license = "MIT"
repository = "https://github.com/nirucon/nirux-ii"

[[bin]]
name = "nirux-ii"
path = "src/main.rs"

[dependencies]
x11rb = { version = "0.13", features = ["shm", "render"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
